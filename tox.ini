[tox]
envlist =
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj60
    py{312,313,314}-dj61
    py{312,313,314}-djmain

skipsdist = True

[testenv]
deps =
    dj52: Django==5.2
    dj60: Django==6.0
    dj61: Django==6.1
    djmain: https://github.com/django/django/tarball/main

    django-fsm-log
    django-guardian
    django-stubs-ext
    django-unfold
    graphviz
    pep8
    pyflakes
    pytest
    pytest-django
    pytest-cov

commands = {posargs:python -m pytest}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
